[package]
name = "brave-portable-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Installation-free Brave portable launcher"

[[bin]]
name = "BravePortable"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
