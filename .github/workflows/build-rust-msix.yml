name: Build Brave Rust MSIX

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Brave release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - nightly
      publisher:
        description: Certificate subject for MSIX identity (must match signing certificate)
        required: true
        default: CN=Chaython
        type: string
  push:
    branches: [main]
    paths:
      - 'msix-rust/**'
      - 'download_brave.ps1'
      - '.github/workflows/build-rust-msix.yml'

permissions:
  contents: read

concurrency:
  group: brave-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-msix:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      EDITION: ${{ inputs.edition || 'stable' }}
      PUBLISHER: ${{ inputs.publisher || 'CN=Chaython' }}
      SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust x64 MSVC
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc
          cargo --version

      - name: Validate builder syntax and manifest template
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path msix-rust/build-msix.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'MSIX builder PowerShell syntax invalid.'
          }
          [xml]$template = Get-Content msix-rust/AppxManifest.xml.in -Raw
          if (-not $template.Package.Applications) { throw 'MSIX manifest missing Applications.' }

      - name: Download Brave release binaries
        run: |
          ./download_brave.ps1 -Edition $env:EDITION -OutDir (Join-Path $PWD 'msix-source')
          $braves = @(Get-ChildItem msix-source/app -Recurse -File -Filter brave.exe)
          if ($braves.Count -ne 1) { throw "Expected one Brave executable, found $($braves.Count)" }

      - name: Determine MSIX version
        run: |
          $run = [int64]$env:GITHUB_RUN_NUMBER
          if ($run -gt 65535) { throw 'Run number exceeds MSIX version component limit.' }
          "MSIX_VERSION=1.0.$run.0" >> $env:GITHUB_ENV

      - name: Prepare optional signing certificate
        if: env.SIGNING_PFX_BASE64 != ''
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'MSIX_SIGNING_PFX_PASSWORD must be supplied when a signing PFX is configured.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'brave-msix-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "MSIX_PFX_PATH=$path" >> $env:GITHUB_ENV

      - name: Build and package Brave MSIX
        run: |
          $params = @{
            BraveDir = (Resolve-Path msix-source/app).ProviderPath
            Publisher = $env:PUBLISHER
            Version = $env:MSIX_VERSION
          }
          if ($env:MSIX_PFX_PATH) {
            $params.PfxPath = $env:MSIX_PFX_PATH
            $params.PfxPassword = $env:SIGNING_PFX_PASSWORD
          }
          ./msix-rust/build-msix.ps1 @params

      - name: Inspect generated MSIX
        run: |
          $packages = @(Get-ChildItem msix-rust/out -Filter '*.msix' -File)
          if ($packages.Count -ne 1) { throw "Expected one MSIX artifact, found $($packages.Count)." }
          Write-Host "Package: $($packages[0].Name); bytes: $($packages[0].Length)"
          Get-FileHash -Algorithm SHA256 $packages[0].FullName | Format-List

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: brave-portable-msix-${{ env.EDITION }}-${{ env.MSIX_VERSION }}
          path: msix-rust/out/*.msix
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing certificate
        if: always()
        run: |
          if ($env:MSIX_PFX_PATH -and (Test-Path -LiteralPath $env:MSIX_PFX_PATH)) {
            Remove-Item -LiteralPath $env:MSIX_PFX_PATH -Force
          }
