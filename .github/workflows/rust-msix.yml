name: Rust MSIX checks
on:
  push:
    paths:
      - 'msix-rust/**'
      - '.github/workflows/rust-msix.yml'
  pull_request:
    paths:
      - 'msix-rust/**'
      - '.github/workflows/rust-msix.yml'
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust MSVC target
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --manifest-path msix-rust/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Validate PowerShell build script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'msix-rust/build-msix.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate manifest XML
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content msix-rust/AppxManifest.xml.in -Raw
          if (-not $manifest.Package.Applications) { throw 'Missing Applications element' }
